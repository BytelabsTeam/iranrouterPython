[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iranrouter"
version = "0.1.0"
description = "IranRouter Python helper — OpenAI-compatible client"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bytelabs" }]
dependencies = [
    "openai>=1.40.0",
]

[project.urls]
Homepage = "https://iranrouter.net"
Documentation = "https://iranrouter.net/docs"
Repository = "https://github.com/BytelabsTeam/iranrouterPython"

[tool.setuptools.packages.find]
include = ["iranrouter*"]
